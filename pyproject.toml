[project]
name = "test-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lerivd", email = "lrivadeneira.pe@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
test-api = "test_api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
